<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>内房線 臨時時刻表</title>
<meta name="description" content="JR東日本の添付PDFをもとにした、内房線3区間の臨時時刻表。列車を横にスワイプして比較できます。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2326c68c'/%3E%3Cpath d='M13 9v16a7 7 0 0 0 14 0V9' fill='none' stroke='%23091217' stroke-width='5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script src="data.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<main>
 <header><div class="brand"><span class="mark">内</span><div><h1>内房線 <span>臨時時刻表</span></h1><p id="effective">2026年9月25日〜当分の間</p></div></div><span class="edition">添付PDF版</span></header>
 <div class="notice"><span aria-hidden="true">!</span><p><span id="notice-text">掲載時刻はPDFに基づきます。</span><small>掲載PDFに基づく時刻です。リアルタイムの運行情報ではありません。</small></p></div>
 <nav class="routes" aria-label="区間"><button data-route="chiba" aria-pressed="true">千葉 ⇄ 姉ケ崎</button><button data-route="nagaura" aria-pressed="false">袖ケ浦 ⇄ 長浦</button><button data-route="kisarazu" aria-pressed="false">袖ケ浦 ⇄ 木更津</button></nav>
 <section class="search" aria-label="時刻表の条件"><div class="journey"><span id="origin">千葉</span><span class="route-arrow" aria-hidden="true">→</span><span id="destination">姉ケ崎</span><button id="reverse" class="secondary">方向を入替</button></div><div class="time-controls"><label for="time">出発時刻</label><input id="time" type="time" required aria-label="この時刻以降に出発"><button id="now">現在時刻</button><button id="first" class="secondary">始発から</button></div></section>
 <section id="results" aria-label="列車の比較"><div class="result-head"><div><span class="line-badge">内房線</span><span id="count" role="status"></span></div><span class="hint">横にスワイプして比較</span></div><div class="board-frame"><div class="board" id="board" tabindex="0" aria-label="時間軸の時刻表。横と縦にスクロールできます"></div></div><div class="pager"><button id="previous" class="secondary">前の列車</button><span id="range"></span><button id="next" class="secondary">次の列車</button></div><p id="endpoint-note" class="fine"></p><p class="help">縦軸は時刻（10分刻み） · 列車を選ぶと途中駅の時刻を表示</p></section>
 <section id="empty" hidden class="empty"><span class="empty-icon">—</span><h2 id="empty-title"></h2><p id="empty-text"></p><button id="reset" hidden>始発から見る</button></section>
 <footer><p id="source-label">出典：JR東日本 千葉事業本部 · 2026年9月24日現在</p><a id="source-link" href="20260924_c02.pdf" target="_blank" rel="noopener">元の時刻表PDFを開く</a><p class="fine">非公式の閲覧用ツールです。PDFに記載のない接続・運賃・運転日は補完していません。</p></footer>
</main>
<dialog id="detail"><div class="dialog-head"><div><span class="line-badge">内房線</span><h2 id="detail-title"></h2></div><button id="close" class="secondary">閉じる</button></div><p id="detail-duration"></p><ol id="stops"></ol><p class="fine"><span id="detail-note"></span></p></dialog>
<noscript>時刻表の表示にはJavaScriptが必要です。<a href="20260924_c02.pdf">元のPDFを開く</a></noscript>
</body></html>
